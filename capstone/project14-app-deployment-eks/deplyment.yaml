apiVersion: apps/v1
kind: Deployment
metadata:
  name: sajid-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sajid-app
  template:
    metadata:
      labels:
        app: sajid-app
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80